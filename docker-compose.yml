services:

  # ── Backend API ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biznotify_backend
    restart: unless-stopped
    environment:
      NODE_ENV:      production
      PORT:          5000
      DATABASE_URL:  ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TERMII_API_KEY:   ${TERMII_API_KEY:?TERMII_API_KEY must be set}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:?TERMII_SENDER_ID must be set}
      DEFAULT_COUNTRY_CODE:   ${DEFAULT_COUNTRY_CODE:-234}
      DEFAULT_ADMIN_EMAIL:    ${DEFAULT_ADMIN_EMAIL:-admin@biznotify.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin1234}
      FRONTEND_URL: ${FRONTEND_URL:-*}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    expose:
      - "5000"
    networks:
      - biznotify_net

  # ── Frontend (Nginx + React SPA) ──────────────────────────────────
  # Do NOT use `ports` — Dokploy's Traefik already owns 80/443.
  # Just expose internally; the Domain config in Dokploy routes to this container.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biznotify_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - biznotify_net

networks:
  biznotify_net:
    driver: bridge
